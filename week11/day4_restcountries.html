<!DOCTYPE html>
<html>
<head>
  <title>Country Info</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Country Info</h1>
  <input type="text" id="countryInput" placeholder="Enter a country name (e.g Uganda)">
  <button onclick="loadCountry()">Search</button>
  <div id="result">Enter a country name above and click Search.</div>

<script>
// backup data in case API is blocked
const backupData = {
  uganda: { name: "Uganda", capital: "Kampala", region: "Africa", population: 45741000, flag: "🇺🇬" },
  kenya: { name: "Kenya", capital: "Nairobi", region: "Africa", population: 53771000, flag: "🇰🇪" },
  nigeria: { name: "Nigeria", capital: "Abuja", region: "Africa", population: 206139000, flag: "🇳🇬" },
  rwanda: { name: "Rwanda", capital: "Kigali", region: "Africa", population: 12950000, flag: "🇷🇼" }
};

async function loadCountry() {
  const name = document.getElementById("countryInput").value.trim().toLowerCase();
  const resultDiv = document.getElementById("result");
  if(!name) return;

  resultDiv.innerHTML = "Loading...";

  try {
    // try real API first (v2 is best for Uganda)
    const res = await fetch(`https://restcountries.com/v2/name/${name}`);
    if (!res.ok) throw new Error("API failed");
    const data = await res.json();
    const info = data[0];
    resultDiv.innerHTML = `
      <h2>${info.flag} ${info.name}</h2>
      <p><strong>Capital:</strong> ${info.capital}</p>
      <p><strong>Region:</strong> ${info.region}</p>
      <p><strong>Population:</strong> ${info.population.toLocaleString()}</p>
      <p><em>Live data from API</em></p>
    `;
  } catch (error) {
    console.log("API failed, using backup", error);
    // if API fails, use backup
    if (backupData[name]) {
      const info = backupData[name];
      resultDiv.innerHTML = `
        <h2>${info.flag} ${info.name}</h2>
        <p><strong>Capital:</strong> ${info.capital}</p>
        <p><strong>Region:</strong> ${info.region}</p>
        <p><strong>Population:</strong> ${info.population.toLocaleString()}</p>
        <p><em>Offline backup (API blocked, but app works!)</em></p>
      `;
    } else {
      resultDiv.innerHTML = `Error: ${error.message}. Try: Uganda, Kenya, Nigeria, Rwanda (these have offline backup).`;
    }
  }
}
</script>
</body>
</html>
