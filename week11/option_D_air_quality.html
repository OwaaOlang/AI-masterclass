<!DOCTYPE html>
<html>
<head>
<title>Air Quality Health Alert - Kampala</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;max-width:800px;margin:20px auto;padding:15px}
.card{border-radius:12px;padding:20px;margin-top:15px}
.aqi-1{background:#4CAF50;color:white}
.aqi-2{background:#8BC34A;color:black}
.aqi-3{background:#FFEB3B;color:black}
.aqi-4{background:#FF9800;color:white}
.aqi-5{background:#F44336;color:white}
.pollutants{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pollutants div{border:1px solid #ddd;padding:10px;border-radius:8px;min-width:100px}
</style>
</head>
<body>
<h2>🇺🇬 Air Quality Health Alert - Option D</h2>
<input id="cityInput" value="Kampala" placeholder="Enter city e.g Kampala" style="padding:10px;width:65%">
<button onclick="checkAir()" style="padding:10px">Check Air</button>
<div id="result">Click Check Air...</div>

<script>
const OW_KEY = "fde104393d9a1b3a4945b58f5dfa7336";

const cityCoords = {
  "kampala": {lat:0.3476, lon:32.5825},
  "jinja": {lat:0.4244, lon:33.2042},
  "mbarara": {lat:-0.607, lon:30.6545},
  "gulu": {lat:2.7747, lon:32.2989}
};

async function checkAir(){
  const city = document.getElementById("cityInput").value.trim().toLowerCase();
  const div = document.getElementById("result");
  if(!city){ div.innerHTML="Enter city"; return; }
  div.innerHTML="Loading air data for "+city+"...";
  
  try{
    let lat, lon, cityName = city;
    if(cityCoords[city]){
      lat = cityCoords[city].lat; lon = cityCoords[city].lon; cityName = city.charAt(0).toUpperCase()+city.slice(1);
    } else {
      // use geocoding API to get lat/lon
      const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${OW_KEY}`);
      const geo = await geoRes.json();
      if(!geo.length) throw new Error("City not found");
      lat = geo[0].lat; lon = geo[0].lon; cityName = geo[0].name;
    }

    // Current air pollution
    const airRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${OW_KEY}`);
    const air = await airRes.json();
    const aqi = air.list[0].main.aqi;
    const comp = air.list[0].components;

    // Forecast air
    let forecastHtml = "";
    try{
      const fRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution/forecast?lat=${lat}&lon=${lon}&appid=${OW_KEY}`);
      const f = await fRes.json();
      for(let i=0; i<f.list.length && i<24; i+=8){
        const d = f.list[i];
        forecastHtml += `<div>AQI ${d.main.aqi} - ${new Date(d.dt*1000).toDateString()}</div>`;
      }
    }catch(e){ forecastHtml = "<div>Forecast not available</div>"; }

    const aqiText = ["","Good","Fair","Moderate","Poor","Very Poor"];
    const advice = [
      "",
      "Air is Good - Enjoy outdoor activities! Safe for everyone.",
      "Air is Fair - Acceptable. Sensitive people should be careful.",
      "Air is Moderate - Wear mask if you have cough/asthma. Limit outdoor.",
      "Air is Poor - Wear mask! Asthmatics, children, elderly stay indoors.",
      "Air is VERY POOR - DANGER! Everyone wear N95 mask, stay indoors, close windows."
    ];

    div.innerHTML = `
      <div class="card aqi-${aqi}">
        <h2>${cityName} - AQI ${aqi} : ${aqiText[aqi]}</h2>
        <h3>${advice[aqi]}</h3>
      </div>
      <h3>Main Pollutants (μg/m³)</h3>
      <div class="pollutants">
        <div><b>PM2.5</b><br>${comp.pm2_5}</div>
        <div><b>PM10</b><br>${comp.pm10}</div>
        <div><b>NO2</b><br>${comp.no2}</div>
        <div><b>CO</b><br>${comp.co}</div>
        <div><b>O3</b><br>${comp.o3}</div>
      </div>
      <h3>Forecast</h3>
      <div class="pollutants">${forecastHtml}</div>
      <p style="font-size:12px;color:#666;margin-top:15px">PM2.5 is most dangerous - from cars and burning. WHO limit is 15. Kampala often 40+.</p>
    `;
  }catch(e){
    div.innerHTML = `Error: ${e.message}<br>Check key and city. Console F12 for detail`;
    console.error(e);
  }
}
checkAir();
</script>
</body>
</html>
